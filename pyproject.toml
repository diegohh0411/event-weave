[project]
name = "event-weave"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest", "pytest-xdist", "weave-core", "weave-api", "weave-inference", "weave-providers", "httpx"]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.uv.sources]
weave-core = { workspace = true }
weave-api = { workspace = true }
weave-inference = { workspace = true }
weave-providers = { workspace = true }
