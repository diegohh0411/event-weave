[project]
name = "event-weave"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest", "pytest-xdist", "weave-core"]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.uv.sources]
weave-core = { workspace = true }
