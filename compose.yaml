x-worker: &worker
  build:
    context: .
    target: app
  image: event-weave:latest
  restart: unless-stopped
  environment:
    WEAVE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weave}:${POSTGRES_PASSWORD:-weave}@postgres:5432/${POSTGRES_DB:-weave}
    WEAVE_INFERENCE_FILE: /app/inference.yaml
    WEAVE_STANZA_URL: http://stanza:8001
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  volumes:
    - ./inference.yaml:/app/inference.yaml:ro
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17@sha256:54c85cf1c63374d9af06fcf494cd86e133b4accbded69ac7622d11d6e7daef54
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weave}
      POSTGRES_DB: ${POSTGRES_DB:-weave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${WEAVE_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weave} -d ${POSTGRES_DB:-weave}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: app
    image: event-weave:latest
    restart: unless-stopped
    environment:
      WEAVE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weave}:${POSTGRES_PASSWORD:-weave}@postgres:5432/${POSTGRES_DB:-weave}
      WEAVE_INFERENCE_FILE: /app/inference.yaml
      WEAVE_WEB_ORIGINS: ${WEAVE_WEB_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      - ./inference.yaml:/app/inference.yaml:ro
    ports:
      - "127.0.0.1:${WEAVE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: web
    image: event-weave-web:latest
    restart: unless-stopped
    environment:
      # The browser, not the container, calls the API.
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:${WEAVE_API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEAVE_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional: the stanza service stays available behind its profile and never blocks the crawl stack.
  stanza:
    build:
      context: .
      target: stanza
    image: event-weave-stanza:latest
    restart: unless-stopped
    profiles: ["stanza"]
    volumes:
      - stanza-models:/models
    ports:
      - "127.0.0.1:${WEAVE_STANZA_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker-provide:
    <<: *worker
    command: weave worker --stage provide
  worker-extract:
    <<: *worker
    command: weave worker --stage extract
  worker-tag:
    <<: *worker
    command: weave worker --stage tag
  worker-enrich:
    <<: *worker
    command: weave worker --stage enrich
  worker-embed:
    <<: *worker
    command: weave worker --stage embed
  worker-cluster:
    <<: *worker
    command: weave worker --stage cluster

  # Long-lived crawl queue worker: claims and finishes leased crawl jobs.
  # `podman compose exec crawler weave crawl /app/outlets.yaml` runs an ad-hoc crawl.
  crawler:
    build:
      context: .
      target: crawler
    image: event-weave-crawler:latest
    command: ["weave", "crawl-worker"]
    restart: unless-stopped
    environment:
      WEAVE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weave}:${POSTGRES_PASSWORD:-weave}@postgres:5432/${POSTGRES_DB:-weave}
      WEAVE_CRAWL_BROWSER_URL: http://crawl-browser:8081
      WEAVE_CRAWL_EGRESS_PROXY: http://crawl-egress:8080
      WEAVE_CRAWL_RESPECT_ROBOTS: ${WEAVE_CRAWL_RESPECT_ROBOTS:-false}
    networks: [default, crawl-isolated]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      crawl-browser:
        condition: service_healthy

  crawl-browser:
    build:
      context: .
      target: crawl-browser
    image: event-weave-crawl-browser:latest
    restart: unless-stopped
    environment:
      WEAVE_CRAWL_EGRESS_PROXY: http://crawl-egress:8080
    networks: [crawl-isolated]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      crawl-egress:
        condition: service_started

  crawl-egress:
    build:
      context: .
      target: app
    image: event-weave:latest
    command: ["python", "-m", "weave_providers.crawl.egress"]
    user: "10001:10001"
    restart: unless-stopped
    networks: [crawl-isolated, crawl-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64

networks:
  crawl-isolated:
    internal: true
  crawl-egress:

volumes:
  pgdata:
  stanza-models:
