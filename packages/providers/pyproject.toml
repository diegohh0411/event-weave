[project]
name = "weave-providers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["weave-core", "pyyaml>=6.0.3", "httpx>=0.27"]

[project.optional-dependencies]
crawl = ["feedparser>=6", "defusedxml>=0.7", "crawl4ai==0.9.5", "curl_cffi>=0.7.4"]

[tool.uv.sources]
weave-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_providers"]

[project.entry-points."weave.adapters"]
mcecr = "weave_providers.mcecr.adapter:McecrProvider"
replay = "weave_providers.replay:ReplayProvider"
