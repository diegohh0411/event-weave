[project]
name = "weave-providers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["weave-core"]

[tool.uv.sources]
weave-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_providers"]

[project.entry-points."weave.adapters"]
mcecr = "weave_providers.mcecr.adapter:McecrProvider"
