[project]
name = "weave-clusterer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["weave-core", "weave-inference", "pydantic>=2"]

[tool.uv.sources]
weave-core = { workspace = true }
weave-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_clusterer"]

[project.entry-points."weave.adapters"]
embedding-gemma = "weave_clusterer.embed:EmbeddingGemmaEmbedder"
threshold = "weave_clusterer.threshold:ThresholdClusterer"
system-one = "weave_clusterer.system_one:SystemOneClusterer"
