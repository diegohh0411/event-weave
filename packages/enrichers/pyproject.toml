[project]
name = "weave-enrichers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["weave-core", "weave-inference", "pydantic>=2", "httpx>=0.27"]

[tool.uv.sources]
weave-core = { workspace = true }
weave-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_enrichers"]

[project.entry-points."weave.adapters"]
clairic = "weave_enrichers.clairic:ClairicEnricher"
