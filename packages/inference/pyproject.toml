[project]
name = "weave-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["weave-core", "pydantic>=2", "pyyaml>=6.0.3"]

[tool.uv.sources]
weave-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_inference"]
