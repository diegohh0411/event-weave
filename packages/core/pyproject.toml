[project]
name = "weave-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.1.1",
    "psycopg[binary]>=3.2",
    "alembic",
    "pydantic>=2",
    "typer",
    "pyyaml>=6.0.3",
]

[project.scripts]
weave = "weave_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
